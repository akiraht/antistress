<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Office Suit - Đồng Nghiệp Thảo Mai -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="rgba(15,23,42,0.4)" />
  <!-- Shirt Body -->
  <path d="M60 115 C52 160 55 200 65 215 L135 215 C145 200 148 160 140 115 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  <!-- Collar -->
  <polygon points="80,115 100,138 120,115 108,115 100,126 92,115" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5" />
  <!-- Red Tie -->
  <polygon points="97,135 103,135 106,180 100,192 94,180" fill="#EF4444" stroke="#991B1B" stroke-width="2" />
  <!-- ID Badge Lanyard -->
  <line x1="84" y1="115" x2="112" y2="168" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="3 2" />
  <rect x="108" y="160" width="18" height="13" rx="2" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.2" />
  <rect x="110" y="162" width="6" height="8" fill="#FFFFFF" />
  <!-- Arms -->
  <path d="M60 130 C35 145 32 175 44 190 C52 182 52 165 65 155" fill="#E2E8F0" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  <path d="M140 130 C165 145 168 175 156 190 C148 182 148 165 135 155" fill="#E2E8F0" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  <!-- Head -->
  <circle cx="100" cy="75" r="42" fill="#FDE047" stroke="#0F172A" stroke-width="5" />
  <!-- Hair Styled Side Part -->
  <path d="M65 60 C76 35 116 32 135 60 C124 44 96 40 73 52 Z" fill="#3B2613" stroke="#1C1209" stroke-width="2" />
  <line x1="96" y1="40" x2="104" y2="60" stroke="#1C1209" stroke-width="2" />
  <!-- Eyes -->
  <circle cx="86" cy="74" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
  <circle cx="88" cy="74" r="2.8" fill="#0F172A" />
  <circle cx="114" cy="74" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
  <circle cx="112" cy="74" r="2.8" fill="#0F172A" />
  <!-- Eyebrows -->
  <path d="M78 64 L92 68" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <path d="M122 64 L108 68" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <!-- Fake Polite Smile -->
  <path d="M88 96 Q 100 88 112 96" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Label tag -->
  <rect x="52" y="196" width="96" height="22" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.8" />
  <text x="100" y="211" text-anchor="middle" fill="#60A5FA" font-size="8.5" font-weight="900" font-family="monospace">THẢO MAI CÔNG SỞ</text>

  <!-- ================= BIẾN DẠNG MẮT VÀ MIỆNG BỊ ĐẬP TƠI BỜI ================= -->
  <!-- Má trái sưng tím bầm -->
  <ellipse cx="78" cy="82" rx="14" ry="10" fill="#EF4444" opacity="0.6" />
  <circle cx="75" cy="80" r="6" fill="#991B1B" opacity="0.4" />

  <!-- Băng gạc dán chéo má phải -->
  <g transform="rotate(15, 125, 78)">
    <rect x="115" y="75" width="20" height="8" rx="2" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5" />
    <rect x="121" y="69" width="8" height="20" rx="2" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5" />
  </g>

  <!-- Mắt trái: Chữ X bầm dập -->
  <line x1="80" y1="66" x2="94" y2="80" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" />
  <line x1="94" y1="66" x2="80" y2="80" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" />

  <!-- Mắt phải: Chữ X bầm dập -->
  <line x1="108" y1="66" x2="122" y2="80" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" />
  <line x1="122" y1="66" x2="108" y2="80" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" />

  <!-- Miệng méo xệch há hốc đau đớn + răng sứt -->
  <path d="M86 92 Q 100 115 116 95 Q 100 102 86 92 Z" fill="#991B1B" stroke="#450A0A" stroke-width="3" />
  <rect x="92" y="92" width="5" height="5" fill="#FFFFFF" />
  <rect x="103" y="94" width="5" height="5" fill="#FFFFFF" />

  <!-- Nước mắt cá sấu bắn ra -->
  <circle cx="70" cy="68" r="4" fill="#38BDF8" />
  <circle cx="130" cy="68" r="4" fill="#38BDF8" />

</svg>

