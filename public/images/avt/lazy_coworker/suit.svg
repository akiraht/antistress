<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Lazy Coworker - Thánh Đùn Việc (Cute Rage Chibi) -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="rgba(132, 94, 194, 0.2)" />
  <!-- Pyjama Blanket Body -->
  <path d="M55 125 C45 165 52 205 65 215 L135 215 C148 205 155 165 145 125 Z" fill="#845EC2" stroke="#2D1F3D" stroke-width="5" stroke-linejoin="round" />
  <!-- Polka dots on pyjama -->
  <circle cx="80" cy="155" r="4" fill="#FFC75F" />
  <circle cx="120" cy="160" r="4" fill="#FFC75F" />
  <circle cx="95" cy="185" r="4" fill="#FF6F91" />
  <circle cx="70" cy="195" r="3.5" fill="#FF9671" />
  <circle cx="130" cy="195" r="3.5" fill="#FF9671" />
  <!-- Holding Sleep Pillow -->
  <rect x="75" y="145" width="50" height="32" rx="10" fill="#FFF8F0" stroke="#2D1F3D" stroke-width="3" transform="rotate(-6 100 161)" />
  <path d="M85 155 Q 100 165 115 155" stroke="#D65DB1" stroke-width="2" fill="none" />
  <!-- Head -->
  <circle cx="100" cy="78" r="44" fill="#FFC75F" stroke="#2D1F3D" stroke-width="5" />
  <!-- Sleep Cap -->
  <path d="M68 62 C70 30 130 25 138 58 Z" fill="#FF6F91" stroke="#2D1F3D" stroke-width="3" />
  <circle cx="140" cy="62" r="7" fill="#FFF8F0" stroke="#2D1F3D" stroke-width="2" />
  <!-- Dark Eye Bags (Thâm quầng) -->
  <path d="M78 84 Q 88 92 98 84" stroke="#845EC2" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M102 84 Q 112 92 122 84" stroke="#845EC2" stroke-width="3" fill="none" opacity="0.7" />
  <!-- Sleepy Eyes (Đường cong lim dim) -->
  <path d="M80 78 Q 88 72 96 78" stroke="#2D1F3D" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M104 78 Q 112 72 120 78" stroke="#2D1F3D" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Drool & Yawning Mouth -->
  <ellipse cx="100" cy="98" rx="8" ry="10" fill="#FF9671" stroke="#2D1F3D" stroke-width="3" />
  <path d="M105 102 C108 112 102 118 100 118" stroke="#845EC2" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Label tag -->
  <rect x="48" y="196" width="104" height="24" rx="8" fill="#FFF8F0" stroke="#845EC2" stroke-width="2.5" />
  <text x="100" y="212" text-anchor="middle" fill="#845EC2" font-size="9" font-weight="900" font-family="sans-serif">THÁNH ĐÙN VIỆC</text>
</svg>

