<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Hipster Badboy - Chiến Thần Thị Phi -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="rgba(15,23,42,0.4)" />
  <!-- Leather Jacket Body -->
  <path d="M60 115 C52 160 55 200 65 215 L135 215 C145 200 148 160 140 115 Z" fill="#090D16" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  <!-- Jacket Collar -->
  <path d="M68 115 L100 150 L132 115" stroke="#E2E8F0" stroke-width="3.5" fill="none" />
  <line x1="80" y1="138" x2="120" y2="138" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="3 2" />
  <!-- Lightning Icon on Chest -->
  <path d="M96 160 L104 168 L98 172 L104 184 L94 174 L98 170 Z" fill="#FACC15" />
  <!-- Arms -->
  <path d="M60 130 C35 145 32 175 44 190 C52 182 52 165 65 155" fill="#1E293B" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  <path d="M140 130 C165 145 168 175 156 190 C148 182 148 165 135 155" fill="#1E293B" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  <!-- Head -->
  <circle cx="100" cy="75" r="42" fill="#FDE047" stroke="#0F172A" stroke-width="5" />
  <!-- Purple Undercut Hair -->
  <path d="M62 62 C66 22 114 18 140 58 C128 30 105 26 74 46 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="2" />
  <!-- Gold Earring -->
  <circle cx="58" cy="83" r="4" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <!-- Black Sunglasses -->
  <rect x="74" y="67" width="22" height="14" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="1.8" />
  <rect x="104" y="67" width="22" height="14" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="1.8" />
  <line x1="96" y1="72" x2="104" y2="72" stroke="#0F172A" stroke-width="2.5" />
  <line x1="77" y1="69" x2="93" y2="77" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <line x1="107" y1="69" x2="123" y2="77" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <!-- Toothpick in Mouth -->
  <line x1="108" y1="100" x2="126" y2="106" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
  <!-- Smirk -->
  <path d="M88 98 Q 102 96 112 102" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Label tag -->
  <rect x="52" y="196" width="96" height="22" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.8" />
  <text x="100" y="211" text-anchor="middle" fill="#C084FC" font-size="8.5" font-weight="900" font-family="monospace">CHIẾN THẦN THỊ PHI</text>
</svg>

