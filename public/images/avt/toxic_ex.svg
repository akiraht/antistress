<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Toxic Ex - Người Yêu Cũ Độc Hại (Cute Rage Chibi) -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="rgba(214, 93, 177, 0.2)" />
  <!-- Body -->
  <path d="M58 120 C48 160 52 205 65 215 L135 215 C148 205 152 160 142 120 Z" fill="#D65DB1" stroke="#2D1F3D" stroke-width="5" stroke-linejoin="round" />
  <!-- Broken Heart on Chest -->
  <path d="M100 152 L93 144 C87 138 78 141 78 149 C78 156 86 163 100 174 C114 163 122 156 122 149 C122 141 113 138 107 144 Z" fill="#FF6F91" stroke="#2D1F3D" stroke-width="2.5" />
  <path d="M100 146 L97 155 L103 162 L98 170" stroke="#2D1F3D" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Arms holding withered flower -->
  <path d="M58 135 C35 150 32 175 44 190" stroke="#2D1F3D" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M142 135 C160 145 158 175 146 188" stroke="#2D1F3D" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Drooping Withered Flower -->
  <path d="M148 185 Q 160 178 165 190" stroke="#FF9671" stroke-width="3" fill="none" />
  <circle cx="166" cy="192" r="5" fill="#845EC2" />
  <!-- Head -->
  <circle cx="100" cy="76" r="44" fill="#FFC75F" stroke="#2D1F3D" stroke-width="5" />
  <!-- Slicked back hair with red rose pin -->
  <path d="M62 65 C68 28 132 25 142 62 C130 38 105 32 74 52 Z" fill="#2D1F3D" />
  <circle cx="135" cy="50" r="5" fill="#FF6F91" />
  <!-- Eyes with false innocent tears -->
  <circle cx="86" cy="74" r="6" fill="#FFFFFF" stroke="#2D1F3D" stroke-width="2.5" />
  <circle cx="87" cy="74" r="2.8" fill="#2D1F3D" />
  <circle cx="114" cy="74" r="6" fill="#FFFFFF" stroke="#2D1F3D" stroke-width="2.5" />
  <circle cx="113" cy="74" r="2.8" fill="#2D1F3D" />
  <!-- Crocodile tears (Nước mắt cá sấu) -->
  <ellipse cx="80" cy="85" rx="3" ry="5" fill="#845EC2" opacity="0.8" />
  <ellipse cx="120" cy="85" rx="3" ry="5" fill="#845EC2" opacity="0.8" />
  <!-- Eyebrows Drama -->
  <path d="M78 64 Q 86 60 94 66" stroke="#2D1F3D" stroke-width="3" fill="none" />
  <path d="M122 64 Q 114 60 106 66" stroke="#2D1F3D" stroke-width="3" fill="none" />
  <!-- Smirking Two-faced mouth -->
  <path d="M88 96 Q 102 92 112 100" stroke="#2D1F3D" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Label tag -->
  <rect x="42" y="196" width="116" height="24" rx="8" fill="#FFF8F0" stroke="#D65DB1" stroke-width="2.5" />
  <text x="100" y="212" text-anchor="middle" fill="#D65DB1" font-size="8.5" font-weight="900" font-family="sans-serif">NYC ĐỘC HẠI GHOSTING</text>
</svg>

